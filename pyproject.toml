[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnb-field-survey"
version = "0.1.0"
description = "5G gNB localisation from GNSS field survey data"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
    "pyproj",
]

[project.scripts]
gnb-survey = "gnb_survey.cli.dispatch:cli_entry"

[project.optional-dependencies]
# manimgl pulls in pydub, which imports the stdlib `audioop` module that PEP 594
# removed in Python 3.13; pydub's fallback (`pyaudioop`) was never published.
# Without the backport, `import manimlib` fails outright on 3.13+.
animation = [
    "manimgl",
    "audioop-lts; python_version >= '3.13'",
]
dev = ["pytest"]

[tool.setuptools]
packages = ["gnb_survey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated function/module tests",
    "integration: tests that read the real files under data/raw/",
]
